name: Blizzard API check

# Checks the Blizzard API keys work and what answers for WoW: Forever. The
# answers (public game data only, never the keys or token) are saved to the
# probe-output branch so they can be read.
on:
  workflow_dispatch: # run by hand from the Actions tab
  push:
    branches: [main]
    paths: [".github/workflows/blizzard-probe.yml"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Sign in and call the API
        env:
          CID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          CSECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: |
          set -u
          RESP=$(curl -s --http1.1 -u "$CID:$CSECRET" -d grant_type=client_credentials https://oauth.battle.net/token)
          TOKEN=$(echo "$RESP" | jq -r '.access_token // empty')
          [ -n "$TOKEN" ] || { echo "Sign-in failed"; exit 1; }
          echo "::add-mask::$TOKEN"
          mkdir -p out
          n=0
          call() {
            n=$((n + 1))
            code=$(curl --http1.1 --retry 2 --max-time 30 -s -o "out/$n.json" -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" "https://us.api.blizzard.com$1" || echo 000)
            echo "$code $1" >> out/index.txt
          }
          P="namespace=profile-forever-us&locale=en_US"
          S="namespace=static-forever-us&locale=en_US"
          for c in sathryus-wraithblade bambo-dreadborne; do
            C=/profile/wow/character/$c
            for sub in /achievements/statistics /quests /quests/completed /encounters/dungeons /encounters/raids /equipment; do
              call "$C$sub?$P"
            done
          done
          call "/data/wow/item/8348?$S"
          call "/data/wow/achievement-category/index?$S"
          call "/data/wow/guild/the-imperium/activity?$P"
          cat out/index.txt
      - name: Save the answers
        run: |
          cd out
          git init -q -b probe-output
          git config user.name "Warcrest bot"; git config user.email "fantasyglassui@gmail.com"
          git add -A && git commit -q -m "Blizzard API answers"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-output
